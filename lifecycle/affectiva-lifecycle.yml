  current_version: 0.1.0
  in_path: false
  in_header: false
  evidence: >-
    All thirteen Swagger documents declare `info.version: 0.1.0` and `basePath: /`. There is
    no /v1 prefix, no version query parameter and no version request header anywhere in the
    contract set — an API with no addressable version cannot be versioned off safely.
  note: >-
    The affdex.js browser SDK versions independently and IS pinned in its distribution path
