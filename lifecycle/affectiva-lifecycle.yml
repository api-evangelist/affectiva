description: >-
  Lifecycle posture for Affectiva. There is no published versioning policy, no deprecation
  policy, no Sunset/Deprecation header usage, no SLA and no status page. What the record DOES
  show is an unusually clear decay trail: two developer-documentation hosts have been
  decommissioned or walled since the Smart Eye acquisition, the browser SDK has not been
  rebuilt since 2018, and the company's own product pages now 301 to iMotions.
