paths:
  /data_collection_projects/{projectID}/event_configs/{configID}/event_instances:
    get:
      tags:
      - event instances
      summary: Get the project's event instance
      responses:
        '200':
          description: Success
        '404':
          description: Not found
        '405':
          description: Invalid input
      parameters:
      - in: path
        name: projectID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: configID
        required: true
        schema:
          type: integer
          format: int64
      security:
      - basicAuth: []
      operationId: getDataCollectionProjectsByProjectIDEventConfigsByConfigIDEventInstances
      x-operation-id-source: derived
    post:
      tags:
      - event instances
      summary: Add a new event instance to the project
      parameters:
      - in: path
        name: projectID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: configID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '201':
          description: Success,created
        '422':
          description: Unprocessable Entity
      security:
      - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - parent_entry_id
              properties:
                parent_entry_id:
                  type: integer
                start_frame_num:
                  type: integer
                  example: 20
                end_frame_num:
                  type: integer
                  example: 40
                start_ts_ms:
                  type: integer
                  example: 16433976073929140
                end_ts_ms:
                  type: integer
                  example: 16433976073929170
      operationId: postDataCollectionProjectsByProjectIDEventConfigsByConfigIDEventInstances
      x-operation-id-source: derived
