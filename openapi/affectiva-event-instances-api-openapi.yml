        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: configsID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: instanceID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Deleted successfully
        '400':
          description: Bad request
        '404':
