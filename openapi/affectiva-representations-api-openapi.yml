openapi: 3.2.0
info:
  description: This is a documentation for Eaas api-experiments
  version: 0.1.0
  title: Eaas Representations API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: /
tags:
- name: Representations
  externalDocs:
    description: Find out more
    url: http://swagger.io
paths:
  /entries/{entryID}/representations:
    post:
      tags:
      - Representations
      summary: Add a new representation
      description: ''
      parameters:
      - name: entryID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '201':
          description: Success, representation created
        '422':
          description: Unprocessable Entity
      security:
      - basicAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  description: representation file
                  format: binary
                storage_type:
                  type: string
                  description: storage type(s3-efs-nas)
              required:
              - media
          application/json:
            schema:
              type: object
              properties:
                media:
                  type: string
                  description: representation file
                  format: binary
                storage_type:
                  type: string
                  description: storage type(s3-efs-nas)
              required:
              - media
      operationId: postEntriesByEntryIDRepresentations
      x-operation-id-source: derived
  /entries/{entryID}/representations/{representationID}:
    get:
      tags:
      - Representations
      summary: Find representation by ID
      description: Returns a single representation
      parameters:
      - in: path
        name: entryID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: representationID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
        '400':
          description: Bad request
        '404':
          description: Not found
      security:
      - basicAuth: []
      operationId: getEntriesByEntryIDRepresentationsByRepresentationID
      x-operation-id-source: derived
    put:
      tags:
      - Representations
      summary: Updates a representation
      description: ''
      parameters:
      - name: entryID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: representationID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '201':
          description: Updated successfully
        '400':
          description: Bad request
        '404':
          description: Not found
        '422':
          description: Unprocessable Entity
      security:
      - basicAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  format: binary
                storage_type:
                  type: string
              required:
              - media
              - storage_type
      operationId: putEntriesByEntryIDRepresentationsByRepresentationID
      x-operation-id-source: derived
    delete:
      tags:
      - Representations
      summary: Delete representation by ID
      parameters:
      - in: path
        name: entryID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: representationID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Deleted successfully
        '400':
          description: Bad request
        '404':
          description: Not found
      security:
      - basicAuth: []
      operationId: deleteEntriesByEntryIDRepresentationsByRepresentationID
      x-operation-id-source: derived
  /entries/{entryID}/representations/{representationID}/media:
    get:
      tags:
      - Representations
      summary: Find representation media by ID
      description: Returns a single representation media file
      parameters:
      - in: path
        name: entryID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: representationID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
        '400':
          description: Bad request
        '404':
          description: Not found
      security:
      - basicAuth: []
      operationId: getEntriesByEntryIDRepresentationsByRepresentationIDMedia
      x-operation-id-source: derived
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
