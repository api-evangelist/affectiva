apis:
- aid: affectiva-facial-coding-api
  name: Affectiva Facial Coding API
  description: The Affectiva Facial Coding API — branded internally as "EaaS" (Emotion as a Service) —
    is the cloud service behind Affectiva's facial-coding products. A consumer uploads video and receives
    frame-by-frame expression and Action Unit metrics as JSON or CSV. The published contract surface is
    thirteen Swagger 2.0 documents served from the Swagger UI at index.affectiva.com/swagger covering
    data collection projects, jobs, entries and their annotations, representations and representation
    storages, event configs and event instances, frame sampling jobs, video frames, video segments, and
    the labeling jobs / tasks / annotations trio. The live API answers HTTP Basic with WWW-Authenticate
    realm "Affectiva Facial Coding API"; all 51 operations require an account and there is no public self-service
    sign-up.
