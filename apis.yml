    Affectiva''s own registrable domain — and the live API at that host answers every request with WWW-Authenticate:
    Basic realm="Affectiva Facial Coding API", naming the provider in the contract''s own runtime behaviour.
    No servers[]/host, info.contact or terms field in any document points at another company. The console
    sign-in page is branded "iMotions Developer Platform" because Affectiva''s product line was folded
    into its Smart Eye sibling iMotions after the 2021 acquisition — affectiva.com''s own product, solutions
    and contact pages 301 to imotions.com — so the sibling branding is the documented parent-brand case,
    not a Leadpages-shaped mis-attribution.'
