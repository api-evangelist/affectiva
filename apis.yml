aid: affectiva
name: Affectiva
description: Affectiva is an Emotion AI company founded out of the MIT Media Lab and headquartered in
  Boston, Massachusetts. Its AFFDEX science analyzes spontaneous facial expressions and speech to measure
  emotion, attention and cognitive state, trained on what the company describes as the world's largest
  emotion data set — 17.4M face videos and 8B facial frames gathered across 90 countries over 18 years.
  The technology is sold into media analytics (ad testing, entertainment content testing, qualitative
  research), in-cabin automotive sensing for driver and occupant monitoring, and academic behavioral research.
  Affectiva was acquired by Smart Eye AB in 2021 and its commercial product line has since been folded
  into the iMotions brand. Its developer surface is the Affectiva Facial Coding API — a cloud "EaaS" (Emotion
  as a Service) platform documented by thirteen Swagger 2.0 contracts at index.affectiva.com/swagger,
  plus the browser-side affdex.js Emotion SDK distributed from the company CDN and an Automotive SDK available
  on request.
